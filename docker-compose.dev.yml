# Local development on top of the production file (the same services, volumes and healthchecks):
#   cp .env.example .env      # fill in GEMINI_API_KEY (or another provider)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# API: http://localhost:8000 (QGEN_API_PORT), documentation: http://localhost:8000/docs
# Faster build without OCR: QGEN_INSTALL_OCR=false in .env.
# QGEN_ENV=development: a missing QGEN_API_KEYS / QGEN_WEBHOOK_SECRET is only a warning.
# Webhooks to the host (tools/webhook_receiver.py): callback_url http://host.docker.internal:9000/webhook,
# QGEN_WEBHOOK_ALLOWED_HOSTS=host.docker.internal (README, "Webhooky").
x-dev: &dev
  environment:
    QGEN_ENV: development
  extra_hosts:
    - "host.docker.internal:host-gateway"   # Linux; Docker Desktop has it built in

services:
  api:
    <<: *dev
    ports: ["${QGEN_API_PORT:-8000}:8000"]
  worker: *dev
  webhook-worker: *dev

networks:
  eceh:
    external: false
    name: ${QGEN_DEV_NETWORK:-qgen-eceh-dev}   # no ECEH network on a developer machine
